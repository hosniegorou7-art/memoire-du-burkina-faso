<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" class="rounded-2xl shadow-2xl">
  <defs>
    <linearGradient id="sky-yennenga" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="savannah-ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ciel crépusculaire du Faso -->
  <rect width="800" height="480" fill="url(#sky-yennenga)" />

  <!-- Soleil couchant géant -->
  <circle cx="580" cy="220" r="140" fill="url(#sun-glow)" />

  <!-- Silhouette du grand baobab millénaire -->
  <g fill="#291206" opacity="0.85">
    <path d="M 680 380 Q 690 280 670 230 Q 640 180 590 160 Q 620 130 670 120 Q 720 130 740 160 Q 780 180 810 230 Q 770 260 760 380 Z" />
    <!-- Branches maîtresses -->
    <path d="M 670 230 Q 620 180 570 190 Q 560 170 610 160 Z" />
    <path d="M 720 220 Q 770 170 820 180 Q 800 160 740 170 Z" />
  </g>

  <!-- Relief lointain de savane -->
  <path d="M 0 340 Q 200 310 400 330 T 800 320 L 800 480 L 0 480 Z" fill="#92400e" opacity="0.6"/>
  <!-- Sol au premier plan -->
  <path d="M 0 360 Q 280 340 500 370 T 800 350 L 800 480 L 0 480 Z" fill="url(#savannah-ground)"/>

  <!-- Étalon blanc cabré au galop héroïque -->
  <g transform="translate(180, 110)">
    <!-- Ombre de l'étalon -->
    <ellipse cx="140" cy="270" rx="130" ry="22" fill="#261005" opacity="0.6" />

    <!-- Corps du cheval blanc d'albâtre -->
    <!-- Sabots arrières ancrés et cuisses puissantes -->
    <path d="M 90 250 Q 80 200 110 170 Q 130 140 180 150 L 220 180 Q 230 220 200 260" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <!-- Jambes arrière -->
    <path d="M 100 240 L 70 270 L 60 285 L 85 285 L 110 250" fill="#f1f5f9" />
    <!-- Croupe et dos -->
    <path d="M 110 170 Q 160 140 210 150 Q 250 140 270 120" fill="#ffffff" />
    <!-- Encolure puissante et tête fière cabrée -->
    <path d="M 240 140 Q 260 90 290 60 Q 310 45 325 55 Q 330 70 310 95 L 280 135 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Museau et naseaux ardents -->
    <circle cx="320" cy="55" r="8" fill="#fda4af" opacity="0.7"/>
    <ellipse cx="322" cy="58" rx="2" ry="3" fill="#1e293b"/>
    <!-- Œil vif -->
    <circle cx="300" cy="62" r="3.5" fill="#0f172a"/>
    <!-- Oreilles dressées vers l'horizon -->
    <polygon points="295,50 300,32 305,52" fill="#ffffff" stroke="#cbd5e1"/>

    <!-- Jambes avant levées en bond d'émancipation -->
    <path d="M 230 170 L 270 200 L 300 190 L 310 200 L 280 215 L 220 190" fill="#ffffff" />
    <path d="M 240 170 L 255 210 L 290 220 L 280 230 L 245 220 Z" fill="#e2e8f0" />

    <!-- Crinière blanche au vent -->
    <path d="M 270 95 Q 240 80 260 110 Q 230 95 250 130 Q 220 115 240 150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Queue flottante impétueuse -->
    <path d="M 90 180 Q 20 200 10 250 Q 40 220 85 200" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>

    <!-- Harnachement en cuir rouge traditionnel et cauris -->
    <path d="M 315 62 L 280 90 L 240 145" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <circle cx="280" cy="90" r="4" fill="#f59e0b" stroke="#ffffff"/>

    <!-- Princesse Guerrière Yennenga sur son étalon -->
    <!-- Tunique rouge pourpre et or en Faso Dan Fani -->
    <path d="M 170 140 Q 185 85 210 75 Q 235 85 240 135 Z" fill="#dc2626" />
    <!-- Rayures traditionnelles Dan Fani or et noir -->
    <path d="M 180 135 L 205 80" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 195 138 L 215 82" stroke="#1c1917" stroke-width="2"/>
    <path d="M 210 138 L 225 85" stroke="#f59e0b" stroke-width="2"/>

    <!-- Bras musclé bandant la lance d'ébène -->
    <path d="M 195 85 L 170 95 L 140 85" stroke="#854d0e" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Main tenant la lance sacrée -->
    <line x1="100" y1="65" x2="280" y2="120" stroke="#78350f" stroke-width="3"/>
    <polygon points="90,62 108,60 103,72" fill="#e2e8f0" stroke="#94a3b8"/>

    <!-- Bras droit tenant les rênes -->
    <path d="M 220 90 L 250 110 L 275 105" stroke="#854d0e" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Buste et visage déterminé de profil -->
    <ellipse cx="215" cy="55" rx="11" ry="14" fill="#854d0e" />
    <path d="M 222 55 L 228 58 L 222 62 Z" fill="#854d0e" /> <!-- Nez fin -->
    <!-- Regard fier -->
    <circle cx="220" cy="53" r="2" fill="#0f172a" />
    <circle cx="221" cy="52" r="0.8" fill="#ffffff" />
    <!-- Tresse royale ornée de perles d'or -->
    <path d="M 210 44 Q 180 50 165 70 Q 155 85 160 100" stroke="#1c1917" stroke-width="5" fill="none"/>
    <circle cx="170" cy="75" r="3" fill="#f59e0b"/>
    <circle cx="162" cy="90" r="3" fill="#f59e0b"/>

    <!-- Écharpe au vent dorée -->
    <path d="M 205 68 Q 140 55 100 45 Q 130 70 185 75" fill="#f59e0b" opacity="0.9"/>
  </g>

  <!-- Titre et citation incrustés avec typographie stylée -->
  <g transform="translate(40, 445)">
    <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="1">YENNENGA</text>
    <text x="145" y="0" font-family="sans-serif" font-weight="500" font-size="13" fill="#fef08a">Mère Fondatrice de la Nation & Cavalière Immortelle</text>
  </g>
</svg>
