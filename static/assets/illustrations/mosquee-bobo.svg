<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="boboSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bancoClay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#5a1a06"/>
    </linearGradient>
    <radialGradient id="sunBobo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#boboSky)"/>
  <circle cx="620" cy="140" r="110" fill="url(#sunBobo)"/>

  <!-- Sol latéritique de Sya / Bobo-Dioulasso -->
  <rect y="380" width="800" height="120" fill="#291205"/>
  <path d="M0 380 Q400 365 800 380 L800 500 L0 500 Z" fill="#451a03"/>

  <!-- Ensemble architectural de la Grande Mosquée de Dioulassoba (Construite en 1880) -->
  <g transform="translate(100, 110)">
    <!-- Mur d'enceinte en terre crue (banco) -->
    <polygon points="40 270, 560 270, 540 180, 60 180" fill="url(#bancoClay)"/>

    <!-- Minaret Central Phare (Tour pyramidale à degrés) -->
    <polygon points="260 180, 340 180, 315 25, 285 25" fill="#5a1a06"/>
    <polygon points="275 180, 325 180, 310 25, 290 25" fill="#78350f"/>
    <!-- Œuf d'autruche traditionnel au sommet (symbole de pureté et fertilité) -->
    <ellipse cx="300" cy="18" rx="8" ry="11" fill="#fffbeb"/>

    <!-- Minarets secondaires de la façade Est -->
    <polygon points="120 180, 170 180, 155 70, 135 70" fill="#5a1a06"/>
    <ellipse cx="145" cy="65" rx="6" ry="8" fill="#fffbeb"/>

    <polygon points="430 180, 480 180, 465 70, 445 70" fill="#5a1a06"/>
    <ellipse cx="455" cy="65" rx="6" ry="8" fill="#fffbeb"/>

    <!-- Contreforts coniques caractéristiques de l'architecture soudano-sahélienne -->
    <polygon points="70 270, 95 270, 85 140, 80 140" fill="#5a1a06"/>
    <polygon points="190 270, 215 270, 205 140, 200 140" fill="#5a1a06"/>
    <polygon points="385 270, 410 270, 400 140, 395 140" fill="#5a1a06"/>
    <polygon points="505 270, 530 270, 520 140, 515 140" fill="#5a1a06"/>

    <!-- Torons horizontaux en bois de rônier (servant d'échafaudage perpétuel lors des crépissages) -->
    <!-- Étage 1 -->
    <line x1="250" y1="50" x2="350" y2="50" stroke="#1c0e05" stroke-width="4" stroke-linecap="round"/>
    <line x1="240" y1="75" x2="360" y2="75" stroke="#1c0e05" stroke-width="4" stroke-linecap="round"/>
    <line x1="230" y1="100" x2="370" y2="100" stroke="#1c0e05" stroke-width="4" stroke-linecap="round"/>
    <line x1="220" y1="125" x2="380" y2="125" stroke="#1c0e05" stroke-width="4" stroke-linecap="round"/>
    <line x1="210" y1="150" x2="390" y2="150" stroke="#1c0e05" stroke-width="4" stroke-linecap="round"/>

    <!-- Torons minarets latéraux -->
    <line x1="115" y1="95" x2="175" y2="95" stroke="#1c0e05" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="120" x2="180" y2="120" stroke="#1c0e05" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="145" x2="185" y2="145" stroke="#1c0e05" stroke-width="3" stroke-linecap="round"/>

    <line x1="425" y1="95" x2="485" y2="95" stroke="#1c0e05" stroke-width="3" stroke-linecap="round"/>
    <line x1="420" y1="120" x2="490" y2="120" stroke="#1c0e05" stroke-width="3" stroke-linecap="round"/>
    <line x1="415" y1="145" x2="495" y2="145" stroke="#1c0e05" stroke-width="3" stroke-linecap="round"/>

    <!-- Portes voûtées traditionnelles de prière -->
    <path d="M280 270 L280 225 Q300 210 320 225 L320 270 Z" fill="#120803"/>
    <path d="M140 270 L140 235 Q150 225 160 235 L160 270 Z" fill="#120803"/>
    <path d="M440 270 L440 235 Q450 225 460 235 L460 270 Z" fill="#120803"/>
  </g>

  <!-- Pèlerins et fidèles en boubou blanc et Faso Dan Fani sur l'esplanade -->
  <g transform="translate(240, 360)">
    <!-- Personnage 1 -->
    <circle cx="50" cy="18" r="6" fill="#120803"/>
    <path d="M42 26 L58 26 L62 70 L38 70 Z" fill="#fef3c7"/>
    <!-- Personnage 2 -->
    <circle cx="90" cy="14" r="6" fill="#120803"/>
    <path d="M80 22 L100 22 L105 70 L75 70 Z" fill="#0284c7"/>
    <!-- Personnage 3 -->
    <circle cx="130" cy="16" r="6" fill="#120803"/>
    <path d="M122 24 L138 24 L142 70 L118 70 Z" fill="#d97706"/>
  </g>

  <!-- Cartouche d'identification patrimoniale -->
  <rect x="25" y="25" width="310" height="52" rx="12" fill="#181410" fill-opacity="0.85" stroke="#d97706" stroke-width="1.5"/>
  <text x="40" y="46" font-family="Plus Jakarta Sans, sans-serif" font-weight="bold" font-size="13" fill="#fef3c7">Grande Mosquée de Dioulassoba</text>
  <text x="40" y="64" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#f59e0b">Région de Guiriko • Architecture Soudanaise en Banco</text>
</svg>
