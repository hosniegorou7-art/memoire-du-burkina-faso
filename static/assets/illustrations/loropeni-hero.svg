<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" class="rounded-2xl shadow-2xl">
  <defs>
    <linearGradient id="loropeni-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#loropeni-sky)"/>

  <!-- Végétation luxuriante de la forêt du Poni (Sud-Ouest) -->
  <path d="M 0 240 Q 200 190 400 230 T 800 200 L 800 480 L 0 480 Z" fill="#14532d"/>
  <circle cx="120" cy="220" r="70" fill="#15803d" opacity="0.6"/>
  <circle cx="280" cy="210" r="80" fill="#166534" opacity="0.6"/>
  <circle cx="680" cy="220" r="90" fill="#14532d" opacity="0.7"/>

  <!-- Immenses murailles de latérite taillée millénaires (Ruines de Loropéni) -->
  <g transform="translate(140, 140)">
    <!-- Mur occidental de 6 mètres de haut en perspective -->
    <polygon points="0,240 0,60 180,90 180,240" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <!-- Face est baignée par la lumière rasante dorée -->
    <polygon points="180,90 480,40 480,240 180,240" fill="#9a3412" stroke="#78350f" stroke-width="2"/>

    <!-- Appareillage de blocs de latérite taillée sans mortier -->
    <g stroke="#451a03" stroke-width="1.5" opacity="0.65">
      <!-- Lignes d'assises horizontales -->
      <line x1="180" y1="110" x2="480" y2="60"/>
      <line x1="180" y1="130" x2="480" y2="80"/>
      <line x1="180" y1="150" x2="480" y2="100"/>
      <line x1="180" y1="170" x2="480" y2="120"/>
      <line x1="180" y1="190" x2="480" y2="140"/>
      <line x1="180" y1="210" x2="480" y2="160"/>
      <!-- Blocs verticaux décalés -->
      <line x1="220" y1="103" x2="220" y2="123"/>
      <line x1="280" y1="93" x2="280" y2="113"/>
      <line x1="340" y1="83" x2="340" y2="103"/>
      <line x1="410" y1="72" x2="410" y2="92"/>
      <line x1="250" y1="123" x2="250" y2="143"/>
      <line x1="310" y1="113" x2="310" y2="133"/>
      <line x1="380" y1="102" x2="380" y2="122"/>
    </g>

    <!-- Brèche et créneaux historiques érodés par les siècles -->
    <polygon points="320,67 340,64 330,76" fill="#6b21a8"/>
  </g>

  <!-- Statuette d'ancêtre Bateba protectrice sculptée au premier plan -->
  <g transform="translate(620, 220)">
    <rect x="25" y="100" width="20" height="110" fill="#451a03"/>
    <ellipse cx="35" cy="80" rx="14" ry="18" fill="#451a03"/>
    <line x1="25" y1="120" x2="10" y2="150" stroke="#451a03" stroke-width="6"/>
    <line x1="45" y1="120" x2="60" y2="150" stroke="#451a03" stroke-width="6"/>
    <circle cx="35" cy="78" r="3" fill="#facc15"/>
  </g>

  <!-- Titre incrusté -->
  <g transform="translate(40, 445)">
    <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="1">LOROPÉNI</text>
    <text x="160" y="0" font-family="sans-serif" font-weight="500" font-size="13" fill="#fef08a">Le Mystère Millénaire des Bâtisseurs de l'Or • Patrimoine Mondial UNESCO</text>
  </g>
</svg>
