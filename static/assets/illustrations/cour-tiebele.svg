<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tiebeleSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0d05"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="bancoWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <pattern id="kassenaPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Chevrons géométriques peints à la main (arêtes de poisson & écailles de serpent sacré) -->
      <polygon points="0 20, 20 0, 40 20, 20 40" fill="#ffffff" fill-opacity="0.9"/>
      <polygon points="5 20, 20 5, 35 20, 20 35" fill="#18181b"/>
      <circle cx="20" cy="20" r="4" fill="#ffffff"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#tiebeleSky)"/>

  <!-- Collines de granite sacré du Nahouri à l'horizon -->
  <polygon points="0 250, 160 210, 340 235, 520 190, 680 230, 800 215, 800 500, 0 500" fill="#291205"/>

  <!-- Sol latéritique battu de la cour royale -->
  <rect y="360" width="800" height="140" fill="#451a03"/>
  <ellipse cx="400" cy="380" rx="380" ry="50" fill="#78350f"/>

  <!-- Habitation fortifiée traditionnelle en huit (Soukholo des aînés) -->
  <g transform="translate(140, 180)">
    <!-- Pièce ronde 1 gauche -->
    <path d="M40 200 Q20 80 120 70 Q220 80 200 200 Z" fill="url(#bancoWall)"/>
    <!-- Toit terrasse en terre étanche à décoction de néré -->
    <ellipse cx="120" cy="75" rx="82" ry="16" fill="#451a03"/>

    <!-- Pièce ronde 2 droite interconnectée -->
    <path d="M190 200 Q180 90 270 85 Q360 90 350 200 Z" fill="url(#bancoWall)"/>
    <ellipse cx="270" cy="90" rx="80" ry="15" fill="#451a03"/>

    <!-- Frises de peintures murales sacrées peintes par les femmes Kasséna -->
    <rect x="55" y="105" width="280" height="45" fill="url(#kassenaPattern)"/>
    <line x1="55" y1="105" x2="335" y2="105" stroke="#ffffff" stroke-width="3"/>
    <line x1="55" y1="150" x2="335" y2="150" stroke="#ffffff" stroke-width="3"/>

    <!-- Porte d'entrée basse et voûtée (obligeant l'assaillant à se baisser avec humilité) -->
    <path d="M100 200 L100 160 Q115 150 130 160 L130 200 Z" fill="#12100e"/>
    <ellipse cx="115" cy="200" rx="20" ry="5" fill="#18181b"/>
  </g>

  <!-- Habitation carrée (Mangolo des jeunes hommes) -->
  <g transform="translate(480, 200)">
    <polygon points="20 180, 220 180, 210 90, 30 90" fill="url(#bancoWall)"/>
    <polygon points="15 90, 225 90, 215 75, 25 75" fill="#451a03"/>
    <!-- Motifs à chevrons verticaux -->
    <rect x="35" y="105" width="165" height="40" fill="url(#kassenaPattern)"/>
    <path d="M105 180 L105 145 Q115 138 125 145 L125 180 Z" fill="#12100e"/>
  </g>

  <!-- Jarres sacrées d'eau et calebasses en argile posées dans la cour -->
  <g transform="translate(410, 370)">
    <circle cx="20" cy="15" r="16" fill="#9a3412"/>
    <ellipse cx="20" cy="4" rx="8" ry="4" fill="#291205"/>
    <circle cx="50" cy="22" r="12" fill="#78350f"/>
  </g>

  <!-- Cartouche patrimonial UNESCO -->
  <rect x="25" y="25" width="310" height="52" rx="12" fill="#181410" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="40" y="46" font-family="Plus Jakarta Sans, sans-serif" font-weight="bold" font-size="13" fill="#fef3c7">Cour Royale de Tiébélé (UNESCO)</text>
  <text x="40" y="64" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#f59e0b">Région de Nazinon • Fresques géométriques Kasséna</text>
</svg>
